# Chạy toàn bộ test (pytest) mỗi khi có người đẩy code lên bất kỳ nhánh nào, và mỗi PR vào main.
# Test không cần dữ liệu thật (data/ nằm trong .gitignore) — chỉ dùng dữ liệu giả sinh trong test.
name: Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:        # bấm chạy tay trên tab Actions

concurrency:                # đẩy liên tiếp lên cùng nhánh → huỷ lần chạy cũ, chỉ giữ lần mới nhất
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          # torch bản CPU (nhẹ hơn nhiều so với bản mặc định có CUDA); cùng phiên bản với requirements.txt
          pip install torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Chạy test
        run: python -m pytest -q
